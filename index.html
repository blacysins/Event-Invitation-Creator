<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Invite</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="form">
      <form id="event-form" novalidate>
        <div><h1 class="bbh-bogle-regular">Create an Event Invite</h1></div>
        <div class="event">
          <div class="label-input">
            <label for="event-name">Event Name</label>
            <input
              type="text"
              id="event-name"
              placeholder="Ex: Keralam JS Meetup"
              required
            />
          </div>
          <div class="label-input">
            <label for="event-date">Event Date</label>
            <input type="date" id="event-date" required />
          </div>
          <div class="label-input">
            <label for="start-time">Start Time</label>
            <input type="time" id="start-time" required />
          </div>
          <div class="label-input">
            <label for="end-time">End Time</label>
            <input type="time" id="end-time" required />
          </div>
          <div class="label-input">
            <label for="event-description">Event Description</label
            ><textarea
              rows="2"
              id="event-description"
              placeholder="Brief Description of the Event"
              required
            ></textarea>
          </div>
          <div class="label-input">
            <label for="event-location">Event Location</label
            ><input
              type="text"
              id="event-location"
              placeholder="Location of the Event"
              required
            />
          </div>
          <div class="label-input">
            <button type="submit">Create Event</button>
          </div>
        </div>
      </form>
      <div class="background-overlay" id="background-overlay">
        <div class="pop-up">
          <span class="close" id="closeBtn">&#10006;</span>
          <p class="validate">Please fill in all fields</p>
        </div>
      </div>
    </section>
    <section class="invitation hide">
      <p class="bbh-bogle-regular" id="heading">YOU ARE INVITED</p>
      <p id="join">TO JOIN THE</p>
      <p id="invite-name" class="bbh-bogle-regular"></p>
      <p id="invite-date"></p>
      <p id="invite-schedule"></p>
      <p id="invite-location"></p>
      <p id="invite-description"></p>
    </section>
  </body>
</html>
